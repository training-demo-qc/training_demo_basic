version: 2

models:
  - name: v_output_invoice_item
    description: 'this is the invoice item table with own brand from material'
    columns:
      - name: nexus_invoice_id
        description: 'primary key'
        data_tests:
          - not_null
          - unique
      - name: header_id
        description: 'foreign key for invoice header'
        data_tests:
          - relationships:
              to: ref('t_output_invoice_header')
              field: header_id
  - name: t_output_invoice_header
    columns:
      - name: header_id
        description: 'primary key'
        data_tests:
          - not_null:
                config:
                  store_failures: true
          - unique
      - name: own_brand
        description: '3 brands Garant, manufacturer''s brand, Holex'
        data_tests:
          - dbt_utils.expression_is_true:
              expression: in ("Garant", "manufacturer's brand", "Holex")
          - not_null:
              config:
                severity: warn
                error_if: ">1000"
                warn_if: '>100'
